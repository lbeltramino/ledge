name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: swift run ledge-tests

      - name: Import signing certificate
        # Everything here is skipped when the secrets are not set, and the
        # release simply goes out unsigned.
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing certificate configured — publishing an unsigned build."
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build Ledge.app
        env:
          LEDGE_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: LEDGE_VERSION="${{ steps.version.outputs.version }}" ./Scripts/bundle.sh release

      - name: Geometry self-test
        run: ./build/Ledge.app/Contents/MacOS/Ledge --selftest

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Ledge.app "dist/Ledge-${{ steps.version.outputs.tag }}.zip"

      - name: Notarise
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/Ledge-${{ steps.version.outputs.tag }}.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/Ledge.app
          rm "dist/Ledge-${{ steps.version.outputs.tag }}.zip"
          ditto -c -k --keepParent build/Ledge.app "dist/Ledge-${{ steps.version.outputs.tag }}.zip"

      - name: Checksums
        run: cd dist && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ledge ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## Install

            Download the zip, unpack it, and move `Ledge.app` to `/Applications`.

            ${{ steps.signing.outputs.signed == 'true' && 'This build is signed and notarised — it should open normally.' || '**This build is not notarised.** macOS will refuse it, and on Apple Silicon it usually says *"Ledge is damaged and can''t be opened"*. It is not damaged — that is the message for an app macOS cannot check. The SHA-256 beside this download will confirm the file arrived intact.

            Double-click it, let macOS refuse, then open **System Settings → Privacy & Security**, scroll to *Security*, and click **Open Anyway**. (Right-click → Open no longer works as a bypass — Apple removed it in Sequoia.)

            Or, from the terminal:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Ledge.app
            ```

            Either one says you vouch for this app. Do that only for software you are willing to vouch for.' }}

            Ledge has no Dock icon. It appears as a coloured stripe on the right
            edge of your screen, and as a small glyph in the menu bar.
            Your notes are plain Markdown files in `~/Documents/Ledge`.
