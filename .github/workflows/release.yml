name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: swift run ledge-tests

      - name: Build Ledge.app
        run: LEDGE_VERSION="${{ steps.version.outputs.version }}" ./Scripts/bundle.sh release

      - name: Geometry self-test
        run: ./build/Ledge.app/Contents/MacOS/Ledge --selftest

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Ledge.app "dist/Ledge-${{ steps.version.outputs.tag }}.zip"
          cd dist && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ledge ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## Install

            Download the zip, unpack it, and move `Ledge.app` to `/Applications`.

            **This build is not signed or notarised**, so Gatekeeper will refuse
            it on first launch. Once, to let it through:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Ledge.app
            ```

            Or right-click the app, choose **Open**, and confirm.

            Ledge has no Dock icon. It appears as a coloured stripe on the right
            edge of your screen, and as a small glyph in the menu bar.
            Your notes are plain Markdown files in `~/Documents/Ledge`.
